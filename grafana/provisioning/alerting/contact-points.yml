apiVersion: 1

contactPoints:
  - orgId: 1
    name: padrao
    receivers:
      - uid: webhook-padrao
        type: webhook
        settings:
          url: ${ALERT_WEBHOOK_URL}
          httpMethod: POST

policies:
  - orgId: 1
    receiver: padrao
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
